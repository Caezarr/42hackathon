name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# push runs on every branch and pull_request too: cancel superseded runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.10.9"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv build
      - run: docker compose config --quiet
      - run: docker build --tag fredo:test .
